openapi: 3.0.3
info:
  title: ADEPT API
  version: "0.3.2"
  description: |
    API del backend de ADEPT: sistema conversacional de estimulación cognitiva
    para adultos mayores (app mobile) con panel de seguimiento para
    profesionales de la salud (web).

    **Contrato primero (ADR-0003).** Este archivo es la fuente de verdad entre
    backend y frontend. Un desvío del código respecto de este contrato es un
    error a corregir. Todo cambio de forma se define primero acá.

    **Autenticación.** El registro y el inicio de sesión los resuelve Amazon
    Cognito directamente desde las apps (no pasan por esta API). Cada request
    lleva un JWT de Cognito en `Authorization: Bearer <token>`. La identidad
    (`userId`) y el rol (`patient` o `professional`) salen del token, nunca del
    body ni de la URL.

    **Modo mock (ADR-0004).** Con `DATA_SOURCE=mock` el backend no valida el
    token y acepta estos headers de prueba: `x-mock-role` (`patient` o
    `professional`, por defecto `patient`) y `x-mock-user-id`. Los datos que
    devuelve son fijos y coinciden con los ejemplos de este archivo.

    **Privacidad (CU04/CU05).** Si el paciente excluyó una categoría de
    indicadores, el panel profesional la omite: la propiedad directamente no
    aparece en la respuesta (no viene en `null` ni con aviso).

    **Cierre de sesión y procesamiento (RNF07, RNF09).** El texto de la
    conversación se conserva solo mientras la sesión está activa. Una sesión
    se cierra por pedido del usuario (`POST /sessions/{sessionId}/close`) o
    por inactividad prolongada. Al cerrarse se encola una única tarea de
    procesamiento por lotes, que calcula los indicadores, clasifica la emoción
    y descarta el texto. La respuesta de la conversación nunca espera a ese
    procesamiento.

    **Categorías emocionales (RF10).** Son las siete del corpus EmoEvent_es:
    `anger`, `disgust`, `fear`, `joy`, `sadness`, `surprise` y `others`. La
    etiqueta de una sesión es la de mayor probabilidad media entre las
    intervenciones del usuario.

    **Cambio de un indicador (MAD).** Para cada indicador se informa la
    distancia robusta respecto de la mediana personal, expresada en
    desviaciones absolutas medianas (`robustDistance`). Un indicador queda
    marcado como afectado (`affected`) cuando esa distancia es 2,5 o más. La
    marca no genera una alerta por sí sola.

servers:
  - url: http://localhost:3000
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Me
    description: Usuario autenticado y consentimiento (RF04)
  - name: Linking
    description: Vinculación paciente-profesional (RF03)
  - name: Privacy
    description: Preferencias de privacidad del paciente (CU04)
  - name: Sessions
    description: Conversación y ejercicios (CU01, CU02, CU03)
  - name: Professional
    description: Panel de seguimiento (CU05)
  - name: Alerts
    description: Notificaciones de anomalía (CU06)

paths:
  /health:
    get:
      tags: [Health]
      summary: Chequeo de salud
      security: []
      x-required-role: none
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  /me:
    get:
      tags: [Me]
      summary: Datos del usuario autenticado
      x-required-role: any
      responses:
        '200':
          description: Perfil básico y estado de consentimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                userId: pat_4471
                role: patient
                username: carlos
                email: carlos@example.com
                consent:
                  accepted: true
                  version: "1.1"
                  acceptedAt: "2026-10-05T14:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El usuario está autenticado pero su perfil todavía no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: profile_not_found
                message: El perfil todavía no existe
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Me]
      summary: Eliminar la cuenta del usuario (CU07)
      description: >
        Suprime los datos personales, las vinculaciones, las métricas derivadas
        y los metadatos de sesión del usuario, y elimina su identidad en el
        servicio de autenticación (RF20). Es irreversible. La confirmación
        explícita se pide en la app y, como resguardo, el backend exige
        `confirm=true`. El historial local del dispositivo lo borra la app.
      x-required-role: patient
      parameters:
        - name: confirm
          in: query
          required: true
          description: Debe ser `true`. Evita borrados por un pedido accidental.
          schema:
            type: boolean
            enum: [true]
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Cuenta eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /consent/terms:
    get:
      tags: [Me]
      summary: Texto vigente del consentimiento informado
      description: El texto viaja desde el backend para poder actualizarlo sin publicar una nueva versión de la app.
      x-required-role: patient
      responses:
        '200':
          description: Versión y texto vigentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentTerms'
              example:
                version: "1.1"
                text: |-
                  Antes de empezar, queremos contarte con claridad qué hace ADEPT con tu información. Aceptar es voluntario.

                  1. Qué es ADEPT

                  ADEPT es una aplicación para conversar y hacer actividades que estimulan la memoria, el lenguaje y el razonamiento. Es un prototipo desarrollado como Proyecto Final de Ingeniería en la Universidad Argentina de la Empresa (UADE). No es un servicio médico, no hace diagnósticos y no reemplaza a un profesional de la salud.

                  2. Qué información recopilamos

                  - Los mensajes que escribís o dictás durante las conversaciones.
                  - Tus respuestas a las actividades.
                  - Tu correo electrónico y tu nombre de usuario.
                  - Datos de uso: cuándo conversás y cuánto dura cada sesión.

                  3. Cómo la usamos

                  Mientras conversás, tus mensajes se usan para generar las respuestas del asistente. Cuando termina la sesión, el sistema analiza lo que dijiste y calcula indicadores: la variedad de las palabras, el largo y el tiempo de tus respuestas, qué tan ordenado es lo que contás, cómo te fue en las actividades y qué emoción predomina (por ejemplo, alegría o tristeza). Además, compara esos indicadores con los de tus propias sesiones anteriores para notar cambios con el tiempo. Estos indicadores no son un diagnóstico.

                  4. Qué guardamos y por cuánto tiempo

                  El texto de tus conversaciones no se guarda de forma permanente: se elimina del sistema cuando termina el análisis de la sesión y, en cualquier caso, vence automáticamente a las 72 horas. De forma permanente solo se conservan los indicadores y los datos de la sesión (fecha y duración), no lo que dijiste. La aplicación puede guardar en tu teléfono una copia cifrada de tus conversaciones para que puedas releerlas; esa copia no se comparte con ningún profesional.

                  5. Envío de mensajes a un proveedor externo

                  Para generar las respuestas, el texto de la conversación se envía por internet a un proveedor externo de modelos de lenguaje (OpenAI), que puede estar en otro país. No le enviamos tu nombre, tu correo ni tus datos de registro: usamos un código anónimo de sesión y solo la parte de la conversación que hace falta. Pedimos la configuración más restrictiva disponible, pero el proveedor puede conservar los datos por un tiempo limitado según sus propias condiciones. Por eso te recomendamos no escribir datos que no quieras compartir, como números de documento, de tarjetas o contraseñas.

                  6. Quién puede ver tus indicadores

                  Solo un profesional de la salud al que vos elijas vincular con un código de invitación y que vos apruebes. Ese profesional no ve el contenido de tus conversaciones: ve únicamente indicadores y señales de cambio, y solo de las categorías que vos permitas (indicadores del lenguaje, estado emocional y señales de cambio). Podés modificar esa elección cuando quieras. Las señales son avisos técnicos que necesitan la interpretación del profesional; no son un diagnóstico.

                  7. Tus derechos

                  En cualquier momento podés: cambiar qué categorías ve tu profesional, desvincularlo, revocar este consentimiento (mientras no lo aceptes, no podrás conversar) y eliminar tu cuenta desde la configuración. Al eliminar la cuenta se borran de nuestro sistema tus datos personales, tus vínculos, tus indicadores y los datos de tus sesiones, y la copia de tus conversaciones que está en tu teléfono.

                  8. Avisos

                  ADEPT no es un servicio de emergencias. Si tenés una urgencia, comunicate con los servicios de emergencia de tu zona. Si esta información cambia, te vamos a pedir que la aceptes de nuevo. Contacto: <adept@adept.com>.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/consent:
    get:
      tags: [Me]
      summary: Estado actual del consentimiento
      description: >
        Si el paciente todavía no respondió, devuelve `accepted: false` con la versión
        vigente y `acceptedAt: null`.
      x-required-role: patient
      responses:
        '200':
          description: Estado del consentimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatus'
              example:
                accepted: true
                version: "1.1"
                acceptedAt: "2026-10-05T14:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Me]
      summary: Aceptar o revocar el consentimiento
      description: >
        La versión enviada tiene que ser la vigente (`GET /consent/terms`); si no,
        responde 400 con `error: invalid_consent_version`.
      x-required-role: patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
            example:
              accepted: true
              version: "1.1"
      responses:
        '400':
          description: El request no cumple el contrato, o la versión del consentimiento no es la vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  summary: Campo faltante, tipo o formato inválido
                  value:
                    error: bad_request
                    message: "/body must have required property 'text'"
                invalidConsentVersion:
                  summary: La versión no es la vigente
                  value:
                    error: invalid_consent_version
                    message: La versión del consentimiento no es la vigente
        '200':
          description: Consentimiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatus'
              example:
                accepted: true
                version: "1.1"
                acceptedAt: "2026-10-05T14:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/professionals:
    get:
      tags: [Linking]
      summary: Profesionales vinculados al paciente
      x-required-role: patient
      responses:
        '200':
          description: Lista de vínculos activos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfessionalLink'
              example:
                items:
                  - professionalId: pro_0001
                    displayName: Dra. Laura Gómez
                    linkedAt: "2026-10-05T15:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Linking]
      summary: Vincularse con un profesional mediante código de invitación
      description: Ingresar el código equivale a la aprobación explícita del paciente (RF03).
      x-required-role: patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
            example:
              invitationCode: ADEPT-TEST
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: Vínculo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalLink'
              example:
                professionalId: pro_0001
                displayName: Dra. Laura Gómez
                linkedAt: "2026-10-05T15:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El código no existe o venció
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invitation_invalid
                message: El código de invitación no existe o venció
        '409':
          description: El paciente ya está vinculado con ese profesional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: already_linked
                message: Ya estás vinculado con este profesional

  /me/professionals/{professionalId}:
    delete:
      tags: [Linking]
      summary: Desvincular a un profesional
      description: El profesional pierde de inmediato el acceso a los datos del paciente.
      x-required-role: patient
      parameters:
        - $ref: '#/components/parameters/ProfessionalId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Vínculo eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/privacy:
    get:
      tags: [Privacy]
      summary: Preferencias de privacidad vigentes
      x-required-role: patient
      responses:
        '200':
          description: Categorías compartidas con el profesional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPreferences'
              example:
                linguisticIndicators: true
                emotionalState: true
                anomalySignals: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Privacy]
      summary: Actualizar preferencias de privacidad
      description: Se aplican a partir de la próxima sesión procesada.
      x-required-role: patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyPreferences'
            example:
              linguisticIndicators: true
              emotionalState: false
              anomalySignals: true
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Preferencias guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPreferences'
              example:
                linguisticIndicators: true
                emotionalState: false
                anomalySignals: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions:
    post:
      tags: [Sessions]
      summary: Abrir una nueva sesión de conversación
      description: >
        El paciente se identifica por el token. Si no aceptó el consentimiento
        vigente, responde 403 con `error: consent_required`. El saludo no
        incluye datos personales: la aplicación puede personalizarlo
        localmente (RNF12).
      x-required-role: patient
      responses:
        '201':
          description: Sesión creada, con el saludo inicial del agente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSessionResponse'
              example:
                sessionId: sess_a93f0001
                status: active
                agentGreeting:
                  text: "Hola, qué bueno verte de nuevo. ¿Cómo estuvo tu día?"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Rol incorrecto (código forbidden) o consentimiento pendiente (código consent_required)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                consentRequired:
                  summary: Falta aceptar el consentimiento vigente
                  value:
                    error: consent_required
                    message: Tenés que aceptar el consentimiento antes de conversar
                forbidden:
                  summary: El rol no corresponde
                  value:
                    error: forbidden
                    message: No tenés permiso para esta operación
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{sessionId}/messages:
    post:
      tags: [Sessions]
      summary: Enviar un mensaje dentro de una sesión activa
      x-required-role: patient
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              text: "Hoy me levanté con ganas de salir a caminar"
              inputType: text
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Respuesta del agente conversacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
              example:
                messageId: msg_8f2a0001
                agentReply:
                  text: "Qué lindo plan. ¿A dónde te gusta ir a caminar?"
                  exerciseProposed: null
                sessionStatus: active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SessionClosed'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /sessions/{sessionId}/exercises/{exerciseId}/responses:
    post:
      tags: [Sessions]
      summary: Registrar la respuesta del usuario a un ejercicio propuesto
      description: >
        A diferencia de un mensaje normal, dispara una evaluación objetiva
        (correcto/incorrecto) que queda registrada como dato propio de la sesión.
      x-required-role: patient
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ExerciseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseResponseRequest'
            example:
              response: "El objeto que no pertenece al grupo es la cuchara"
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Evaluación y continuación de la conversación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponseResult'
              example:
                evaluation:
                  correct: true
                  feedback: "¡Exacto! Las otras tres son frutas."
                agentReply:
                  text: "Muy bien hecho. Seguimos charlando entonces..."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SessionClosed'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /sessions/{sessionId}/close:
    post:
      tags: [Sessions]
      summary: Cerrar una sesión activa
      description: >
        Al cerrar, la sesión se encola para su procesamiento posterior (NLP/ML), de forma
        independiente de la conversación. Es idempotente: cerrar una sesión que ya estaba
        cerrada devuelve el mismo resumen, sin modificar nada. Si la sesión no existe o
        pertenece a otro usuario, responde 404. `messageCount` cuenta los mensajes de ambos
        lados: las intervenciones del usuario más las respuestas del agente, incluido el saludo.
      x-required-role: patient
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Sesión cerrada, con resumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseSessionResponse'
              example:
                sessionId: sess_a93f0001
                status: closed
                summary:
                  messageCount: 12
                  exercisesCompleted: 2
                  durationSeconds: 340
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /professional/invitations:
    post:
      tags: [Professional]
      summary: Generar un código de invitación para vincular a un paciente
      x-required-role: professional
      responses:
        '201':
          description: Código generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
              example:
                code: ADEPT-TEST
                expiresAt: "2026-10-12T15:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /professional/patients:
    get:
      tags: [Professional]
      summary: Pacientes vinculados al profesional
      x-required-role: professional
      responses:
        '200':
          description: Lista de pacientes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientSummary'
              example:
                items:
                  - patientId: pat_4471
                    displayName: Carlos Pérez
                    lastSessionAt: "2026-10-05T14:40:00Z"
                    sessionsProcessed: 12
                    openAlerts: 1
                    latestEmotion: others
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /professional/patients/{patientId}:
    get:
      tags: [Professional]
      summary: Datos personales del paciente
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Datos personales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
              example:
                patientId: pat_4471
                fullName: Carlos Pérez
                birthDate: "1948-03-14"
                phone: "+54 11 5555-0101"
                notes: "Prefiere sesiones por la mañana."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Professional]
      summary: Actualizar datos personales del paciente
      description: Configuración de paciente a nivel individual. No incluye parámetros de detección (ADR-0007).
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfileUpdate'
            example:
              phone: "+54 11 5555-0101"
              notes: "Prefiere sesiones por la mañana."
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Datos actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
              example:
                patientId: pat_4471
                fullName: Carlos Pérez
                birthDate: "1948-03-14"
                phone: "+54 11 5555-0101"
                notes: "Prefiere sesiones por la mañana."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /professional/patients/{patientId}/dashboard:
    get:
      tags: [Professional]
      summary: Dashboard de evolución del paciente
      description: Si no hay sesiones procesadas en el período, devuelve el estado vacío (ceros y sin bloques de indicadores), sin generar alertas.
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Resumen del período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
              example:
                patientId: pat_4471
                period:
                  from: "2026-09-05"
                  to: "2026-10-05"
                sessionsProcessed: 12
                usage:
                  sessionsInPeriod: 12
                  activeDays: 10
                  lastSessionAt: "2026-10-05T14:40:00Z"
                linguisticIndicators:
                  indicators:
                    - key: ttr
                      label: Diversidad léxica (TTR)
                      value: 0.52
                      personalMedian: 0.58
                      robustDistance: 1.4
                      affected: false
                    - key: avg_length_words
                      label: Longitud promedio de respuesta (palabras)
                      value: 14.2
                      personalMedian: 16.0
                      robustDistance: 0.9
                      affected: false
                    - key: avg_response_seconds
                      label: Tiempo promedio de respuesta (segundos)
                      value: 6.8
                      personalMedian: 5.1
                      robustDistance: 1.1
                      affected: false
                    - key: coherence
                      label: Coherencia discursiva
                      value: 0.61
                      personalMedian: 0.66
                      robustDistance: 0.7
                      affected: false
                emotionalState:
                  latestLabel: others
                  distribution:
                    joy: 4
                    others: 5
                    sadness: 2
                    anger: 1
                    fear: 0
                    disgust: 0
                    surprise: 0
                anomalySignals:
                  openAlerts: 1
                  lastDetectedAt: "2026-10-05T14:45:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /professional/patients/{patientId}/history:
    get:
      tags: [Professional]
      summary: Evolución histórica por sesión
      description: Un punto por sesión procesada. Las propiedades de categorías excluidas por el paciente no aparecen.
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: indicator
          in: query
          required: false
          description: Limita la respuesta a un tipo de indicador.
          schema:
            type: string
            enum: [linguistic, emotional, anomaly, usage]
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Serie de sesiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
              example:
                patientId: pat_4471
                points:
                  - sessionId: sess_a93f0001
                    startedAt: "2026-10-05T14:30:00Z"
                    ttr: 0.52
                    avgLengthWords: 14.2
                    avgResponseSeconds: 6.8
                    coherence: 0.61
                    emotionLabel: others
                    anomalyScore: 0.71
                    durationSeconds: 340
                    messageCount: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /professional/patients/{patientId}/sessions/{sessionId}/indicators:
    get:
      tags: [Professional]
      summary: Detalle de variación de una sesión frente a la línea de base
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Indicadores de la sesión comparados con la línea de base del paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIndicatorsResponse'
              example:
                sessionId: sess_a93f0001
                startedAt: "2026-10-05T14:30:00Z"
                indicators:
                  - key: ttr
                    label: Diversidad léxica (TTR)
                    value: 0.52
                    personalMedian: 0.58
                    robustDistance: 1.4
                    affected: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /professional/alerts:
    get:
      tags: [Alerts]
      summary: Centro de alertas
      x-required-role: professional
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, reviewed]
        - name: patientId
          in: query
          required: false
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Alertas del profesional
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertSummary'
              example:
                items:
                  - alertId: alert_0001
                    patientId: pat_4471
                    patientDisplayName: Carlos Pérez
                    sessionId: sess_a93f0001
                    detectedAt: "2026-10-05T14:45:00Z"
                    status: pending
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /professional/alerts/{alertId}:
    get:
      tags: [Alerts]
      summary: Detalle de una alerta
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Sesión, indicadores afectados y comparación con la línea de base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
              example:
                alertId: alert_0001
                patientId: pat_4471
                patientDisplayName: Carlos Pérez
                sessionId: sess_a93f0001
                detectedAt: "2026-10-05T14:45:00Z"
                status: pending
                reviewedAt: null
                affectedIndicators:
                  - key: ttr
                    label: Diversidad léxica (TTR)
                    value: 0.41
                    personalMedian: 0.58
                    robustDistance: 3.1
                    affected: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /professional/alerts/{alertId}/review:
    post:
      tags: [Alerts]
      summary: Marcar una alerta como revisada
      x-required-role: professional
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Alerta archivada en el historial de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
              example:
                alertId: alert_0001
                patientId: pat_4471
                patientDisplayName: Carlos Pérez
                sessionId: sess_a93f0001
                detectedAt: "2026-10-05T14:45:00Z"
                status: reviewed
                reviewedAt: "2026-10-06T09:10:00Z"
                affectedIndicators:
                  - key: ttr
                    label: Diversidad léxica (TTR)
                    value: 0.41
                    personalMedian: 0.58
                    robustDistance: 3.1
                    affected: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Amazon Cognito. El rol viaja en el grupo del usuario.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: Identificador de la sesión
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema:
        type: string
      description: Identificador del ejercicio propuesto por el agente
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
      description: Identificador del paciente (debe estar vinculado al profesional autenticado)
    ProfessionalId:
      name: professionalId
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inicio del período (YYYY-MM-DD)
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Fin del período (YYYY-MM-DD)

  responses:
    BadRequest:
      description: El request no cumple el contrato (campo faltante, tipo o formato inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: "/body must have required property 'text'"
    Unauthorized:
      description: Token ausente, inválido o vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Token ausente o inválido
    Forbidden:
      description: >
        El rol no tiene permiso para esta operación, el recurso no pertenece al
        usuario, o (en POST /sessions) falta aceptar el consentimiento
        (`error: consent_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: No tenés permiso para esta operación
    NotFound:
      description: El recurso no existe, o existe pero el usuario no puede verlo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Recurso no encontrado
    SessionClosed:
      description: La sesión ya está cerrada y no admite más mensajes ni respuestas a ejercicios
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: session_closed
            message: La sesión ya está cerrada
    LlmUnavailable:
      description: El servicio que genera las respuestas del agente no está disponible por ahora
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: llm_unavailable
            message: El asistente no está disponible en este momento. Probá de nuevo en unos minutos
    InternalError:
      description: Error inesperado del servidor (el texto de la conversación nunca se incluye)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Ocurrió un error inesperado

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Código estable legible por máquina
        message:
          type: string
          description: Texto para mostrar o registrar

    Role:
      type: string
      enum: [patient, professional]

    EmotionLabel:
      type: string
      description: Categoría emocional del corpus EmoEvent_es (RF10). La etiqueta de una sesión es la de mayor probabilidad media entre las intervenciones del usuario.
      enum: [anger, disgust, fear, joy, sadness, surprise, others]

    MeResponse:
      type: object
      required: [userId, role, username, email]
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        username:
          type: string
        email:
          type: string
          format: email
        consent:
          $ref: '#/components/schemas/ConsentStatus'

    ConsentTerms:
      type: object
      required: [version, text]
      properties:
        version:
          type: string
        text:
          type: string

    ConsentStatus:
      type: object
      required: [accepted, version]
      properties:
        accepted:
          type: boolean
        version:
          type: string
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    ConsentUpdate:
      type: object
      required: [accepted, version]
      properties:
        accepted:
          type: boolean
        version:
          type: string

    ProfessionalLink:
      type: object
      required: [professionalId, displayName, linkedAt]
      properties:
        professionalId:
          type: string
        displayName:
          type: string
        linkedAt:
          type: string
          format: date-time

    LinkRequest:
      type: object
      required: [invitationCode]
      properties:
        invitationCode:
          type: string

    PrivacyPreferences:
      type: object
      required: [linguisticIndicators, emotionalState, anomalySignals]
      properties:
        linguisticIndicators:
          type: boolean
        emotionalState:
          type: boolean
        anomalySignals:
          type: boolean

    OpenSessionResponse:
      type: object
      required: [sessionId, status, agentGreeting]
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [active]
        agentGreeting:
          type: object
          required: [text]
          properties:
            text:
              type: string

    SendMessageRequest:
      type: object
      required: [text, inputType]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        inputType:
          type: string
          enum: [text, voice]
          description: Se registra aunque la voz todavía no esté implementada, para no cambiar el contrato después.

    ExerciseSummary:
      type: object
      nullable: true
      description: Ejercicio propuesto en este turno, o null si no corresponde proponer uno.
      required: [exerciseId, type, prompt]
      properties:
        exerciseId:
          type: string
        type:
          type: string
        prompt:
          type: string

    SendMessageResponse:
      type: object
      required: [messageId, agentReply, sessionStatus]
      properties:
        messageId:
          type: string
        agentReply:
          type: object
          required: [text, exerciseProposed]
          properties:
            text:
              type: string
            exerciseProposed:
              $ref: '#/components/schemas/ExerciseSummary'
        sessionStatus:
          type: string
          enum: [active, closed]

    ExerciseResponseRequest:
      type: object
      required: [response]
      properties:
        response:
          type: string
          minLength: 1
          maxLength: 500

    ExerciseResponseResult:
      type: object
      required: [evaluation, agentReply]
      properties:
        evaluation:
          type: object
          required: [correct, feedback]
          properties:
            correct:
              type: boolean
            feedback:
              type: string
        agentReply:
          type: object
          required: [text]
          properties:
            text:
              type: string

    CloseSessionResponse:
      type: object
      required: [sessionId, status, summary]
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [closed]
        summary:
          type: object
          required: [messageCount, exercisesCompleted, durationSeconds]
          properties:
            messageCount:
              type: integer
              description: Mensajes de ambos lados (intervenciones del usuario más respuestas del agente, incluido el saludo)
            exercisesCompleted:
              type: integer
            durationSeconds:
              type: integer

    InvitationResponse:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time

    PatientSummary:
      type: object
      required: [patientId, displayName, sessionsProcessed, openAlerts]
      properties:
        patientId:
          type: string
        displayName:
          type: string
        lastSessionAt:
          type: string
          format: date-time
          nullable: true
        sessionsProcessed:
          type: integer
        openAlerts:
          type: integer
        latestEmotion:
          $ref: '#/components/schemas/EmotionLabel'

    PatientProfile:
      type: object
      required: [patientId, fullName]
      properties:
        patientId:
          type: string
        fullName:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          description: Notas del profesional sobre el paciente

    PatientProfileUpdate:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    DashboardResponse:
      type: object
      required: [patientId, period, sessionsProcessed, usage]
      properties:
        patientId:
          type: string
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        sessionsProcessed:
          type: integer
        usage:
          type: object
          required: [sessionsInPeriod, activeDays]
          properties:
            sessionsInPeriod:
              type: integer
            activeDays:
              type: integer
            lastSessionAt:
              type: string
              format: date-time
              nullable: true
        linguisticIndicators:
          type: object
          description: Omitido si el paciente excluyó esta categoría.
          required: [indicators]
          properties:
            indicators:
              type: array
              items:
                $ref: '#/components/schemas/IndicatorComparison'
        emotionalState:
          type: object
          description: Omitido si el paciente excluyó esta categoría.
          required: [latestLabel, distribution]
          properties:
            latestLabel:
              $ref: '#/components/schemas/EmotionLabel'
            distribution:
              type: object
              additionalProperties:
                type: integer
        anomalySignals:
          type: object
          description: Omitido si el paciente excluyó esta categoría.
          required: [openAlerts]
          properties:
            openAlerts:
              type: integer
            lastDetectedAt:
              type: string
              format: date-time
              nullable: true

    HistoryResponse:
      type: object
      required: [patientId, points]
      properties:
        patientId:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SessionPoint'

    SessionPoint:
      type: object
      required: [sessionId, startedAt]
      properties:
        sessionId:
          type: string
        startedAt:
          type: string
          format: date-time
        ttr:
          type: number
        avgLengthWords:
          type: number
        avgResponseSeconds:
          type: number
        coherence:
          type: number
        emotionLabel:
          $ref: '#/components/schemas/EmotionLabel'
        anomalyScore:
          type: number
        durationSeconds:
          type: integer
        messageCount:
          type: integer

    IndicatorComparison:
      type: object
      description: >
        Valor de un indicador en una sesión comparado con la mediana personal
        del paciente. `robustDistance` es la distancia a esa mediana en
        desviaciones absolutas medianas (MAD); `affected` es verdadero cuando
        es 2,5 o más. La marca no genera una alerta por sí sola.
      required: [key, label, value, personalMedian, robustDistance, affected]
      properties:
        key:
          type: string
          description: ttr, avg_length_words, avg_response_seconds, coherence, exercise_score o emotion_code
        label:
          type: string
        value:
          type: number
        personalMedian:
          type: number
        robustDistance:
          type: number
          minimum: 0
        affected:
          type: boolean

    SessionIndicatorsResponse:
      type: object
      required: [sessionId, startedAt, indicators]
      properties:
        sessionId:
          type: string
        startedAt:
          type: string
          format: date-time
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorComparison'

    AlertSummary:
      type: object
      required: [alertId, patientId, patientDisplayName, sessionId, detectedAt, status]
      properties:
        alertId:
          type: string
        patientId:
          type: string
        patientDisplayName:
          type: string
        sessionId:
          type: string
        detectedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, reviewed]

    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/AlertSummary'
        - type: object
          required: [affectedIndicators]
          properties:
            reviewedAt:
              type: string
              format: date-time
              nullable: true
            affectedIndicators:
              type: array
              items:
                $ref: '#/components/schemas/IndicatorComparison'